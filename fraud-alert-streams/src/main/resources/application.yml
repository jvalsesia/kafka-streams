server:
  port: 8082

spring:
  application:
    name: fraud-alert-streams
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: ${KAFKA_STREAMS_APPLICATION_ID:fraud-alert-streams-app}
      auto-startup: true
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        commit.interval.ms: 1000
        auto.offset.reset: earliest

app:
  kafka:
    topics:
      fraud-input: ${FRAUD_INPUT_TOPIC:fraud-detected-transactions}
      alerts-output: ${ALERTS_OUTPUT_TOPIC:alerts}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
